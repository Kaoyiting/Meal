# Order Service Alembic Configuration

[alembic]
# Migration scripts path
script_location = alembic

# Migration script file template
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

# sys.path paths for module imports
prepend_sys_path = .

# Timezone settings
timezone = UTC

# Truncate SQL script length limit
truncate_slug_length = 40

# Version path specification
version_path_separator = os

# Revision environment
version_locations = %(here)s/alembic/versions

# Version table name
version_table = alembic_version

# Version table schema
version_table_schema = 

# Database URL (read from environment variables, env.py will override this setting)
sqlalchemy.url = 

# Logging configuration
[post_write_hooks]
# post_write_hooks define and implement the following hooks
# Formatting tool hooks, such as using "black", "isort", etc.
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S